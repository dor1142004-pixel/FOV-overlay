<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FOV Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; font-family: 'Courier New', monospace; overflow: hidden; }

  .screen {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 40px 28px; background: #000; overflow-y: auto;
  }
  .screen.active { display: flex; }

  .logo { font-size: 10px; letter-spacing: 4px; color: #444; text-transform: uppercase; }
  .screen-title { font-size: 22px; font-weight: 700; color: #fff; text-align: center; }
  .screen-sub { font-size: 12px; color: #555; text-align: center; line-height: 1.7; font-family: system-ui, sans-serif; max-width: 260px; }

  .big-input-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 280px; }
  .big-input-label { font-size: 10px; letter-spacing: 3px; color: #444; text-transform: uppercase; }
  .big-input-row { display: flex; align-items: center; gap: 10px; background: #111; border: 1px solid #222; border-radius: 10px; padding: 10px 16px; width: 100%; }
  .big-input-row input[type=number] {
    background: transparent; border: none; outline: none; color: #0f0;
    font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; flex: 1; width: 0;
    -moz-appearance: textfield;
  }
  .big-input-row input::-webkit-inner-spin-button,
  .big-input-row input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .big-unit { font-size: 13px; color: #444; }

  .input-row-2 { display: flex; gap: 12px; width: 100%; max-width: 280px; }
  .input-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .input-col label { font-size: 10px; letter-spacing: 2px; color: #444; text-transform: uppercase; }
  .input-col .big-input-row { padding: 8px 12px; }
  .input-col .big-input-row input { font-size: 26px; }

  .result-box {
    width: 100%; max-width: 280px; background: #0a1a0a; border: 1px solid #1a3a1a;
    border-radius: 10px; padding: 14px 16px; text-align: center; display: none;
  }
  .result-box.visible { display: block; }
  .result-label { font-size: 10px; letter-spacing: 3px; color: #4a7a4a; text-transform: uppercase; margin-bottom: 6px; }
  .result-val { font-size: 42px; font-weight: 700; color: #0f0; letter-spacing: -2px; line-height: 1; }
  .result-unit { font-size: 16px; color: #0a0; }
  .result-formula { font-size: 10px; color: #2a4a2a; margin-top: 6px; font-family: system-ui, sans-serif; }

  .btn-green {
    background: #0f0; color: #000; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    padding: 15px; cursor: pointer; font-family: 'Courier New', monospace;
    width: 100%; max-width: 280px; -webkit-tap-highlight-color: transparent;
  }
  .btn-green:active { opacity: 0.7; }
  .btn-outline {
    background: transparent; color: #555; border: 1px solid #2a2a2a; border-radius: 8px;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase; padding: 13px;
    cursor: pointer; font-family: 'Courier New', monospace;
    width: 100%; max-width: 280px; -webkit-tap-highlight-color: transparent;
  }
  .btn-outline:active { border-color: #0f0; color: #0f0; }
  .divider {
    font-size: 10px; color: #2a2a2a; letter-spacing: 2px;
    display: flex; align-items: center; gap: 10px; width: 100%; max-width: 280px;
  }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:#1a1a1a; }

  /* camera screen */
  #screen-cam { padding: 0; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #stab-btn {
    position: absolute; top: calc(env(safe-area-inset-top,0px) + 14px); left: 16px;
    background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 8px;
    color: #aaa; font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: 1px; text-transform: uppercase; padding: 8px 14px;
    cursor: pointer; z-index: 10; -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  #stab-btn.active { border-color: #0f0; color: #0f0; background: rgba(0,20,0,0.7); }
  #stab-tilt {
    font-size: 9px; color: #444; letter-spacing: 1px; display: none;
  }
  #stab-btn.active #stab-tilt { display: block; color: #0a0; }
    position: absolute; top: calc(env(safe-area-inset-top,0px) + 14px); left: 16px;
    background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 8px;
    color: #aaa; font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: 1px; text-transform: uppercase; padding: 8px 14px;
    cursor: pointer; z-index: 10; -webkit-tap-highlight-color: transparent;
  }
  #cam-fov-label {
    position: absolute; bottom: calc(env(safe-area-inset-bottom,0px) + 24px);
    left: 50%; transform: translateX(-50%);
    color: #0f0; font-size: 12px; letter-spacing: 2px; z-index: 10;
    background: rgba(0,0,0,0.55); padding: 6px 16px; border-radius: 6px; white-space: nowrap;
  }

  /* level indicator */
  #level-wrap {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    display: none; flex-direction: column; align-items: center; gap: 6px; z-index: 10;
  }
  #level-wrap.visible { display: flex; }
  #level-label { font-size: 9px; color: #666; letter-spacing: 2px; text-transform: uppercase; writing-mode: vertical-rl; transform: rotate(180deg); }
  #level-bar {
    width: 14px; height: 160px;
    background: #111; border: 1px solid #222; border-radius: 8px;
    position: relative; overflow: hidden;
  }
  /* green zone: centre ±1° out of ±5° range = 20% of bar height either side of centre */
  #level-zone {
    position: absolute; left: 0; right: 0;
    height: 20%; top: 40%;  /* ±1° of ±5° = 20% band centred at 50% */
    background: rgba(0,255,0,0.15); border-top: 1px solid rgba(0,255,0,0.3); border-bottom: 1px solid rgba(0,255,0,0.3);
  }
  #level-marker {
    position: absolute; left: 2px; right: 2px; height: 6px;
    background: #f33; border-radius: 3px;
    top: 50%; transform: translateY(-50%);
    transition: top 0.08s linear, background 0.15s;
  }
  #level-marker.ok { background: #0f0; }
  #level-deg {
    font-size: 10px; font-weight: 700; color: #666; letter-spacing: 1px;
    font-family: 'Courier New', monospace;
  }
  #level-deg.ok { color: #0f0; }
  #rec-btn {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff;
    background: rgba(0,0,0,0.35); cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  #rec-btn .inner {
    width: 44px; height: 44px; border-radius: 50%; background: #f33;
    transition: border-radius 0.2s, width 0.2s, height 0.2s;
  }
  #rec-btn.recording .inner { border-radius: 6px; width: 26px; height: 26px; }

  #rec-indicator {
    position: absolute; top: calc(env(safe-area-inset-top,0px) + 14px); right: 16px;
    display: none; align-items: center; gap: 8px; z-index: 10;
  }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #f33; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  #rec-dur { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 2px; }
</style>
</head>
<body>

<!-- Screen 1: Home -->
<div class="screen active" id="screen-home">
  <div class="logo">Fieldview</div>
  <div class="screen-title">FOV Overlay</div>
  <div class="big-input-wrap">
    <span class="big-input-label">Vertical FOV</span>
    <div class="big-input-row">
      <input type="number" id="fov-val" min="1" max="180" value="66" />
      <span class="big-unit">°</span>
    </div>
  </div>
  <button class="btn-green" id="btn-start">Start Camera</button>
  <div class="divider">or</div>
  <button class="btn-outline" id="btn-go-cal">Calibrate VFOV →</button>
</div>

<!-- Screen 2: Calibration -->
<div class="screen" id="screen-cal">
  <div class="logo">Fieldview</div>
  <div class="screen-title">Calibrate</div>
  <p class="screen-sub">Stand at a known distance from a ruler. Center the ruler in the frame so the top and bottom edges align with the top and bottom of the screen.</p>
  <p class="screen-sub" style="color:#2a4a2a;font-size:11px;">VFOV = 2 × atan( (ruler/2) / distance )</p>
  <div class="input-row-2">
    <div class="input-col">
      <label>Ruler height</label>
      <div class="big-input-row">
        <input type="number" id="cal-ruler" min="1" max="9999" value="100" />
        <span class="big-unit">cm</span>
      </div>
    </div>
    <div class="input-col">
      <label>Distance</label>
      <div class="big-input-row">
        <input type="number" id="cal-dist" min="1" max="99999" value="100" />
        <span class="big-unit">cm</span>
      </div>
    </div>
  </div>
  <div class="result-box" id="cal-result">
    <div class="result-label">Computed VFOV</div>
    <div><span class="result-val" id="cal-result-val">—</span><span class="result-unit"> °</span></div>
    <div class="result-formula" id="cal-formula"></div>
  </div>
  <button class="btn-green" id="btn-use-cal" style="display:none;">Use this VFOV</button>
  <button class="btn-outline" id="btn-cal-back">← Back</button>
</div>

<!-- Screen 3: Camera -->
<div class="screen" id="screen-cam">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay-canvas"></canvas>
  <canvas id="comp-canvas" style="display:none;"></canvas>
  <button id="stab-btn">⊕ Stabilize<span id="stab-tilt">0.0°</span></button>
  <button id="cam-back">← Back</button>
  <button id="level-toggle-btn" style="
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 56px); left:16px;
    background:rgba(0,0,0,0.6); border:1px solid #333; border-radius:8px;
    color:#aaa; font-family:'Courier New',monospace; font-size:10px;
    letter-spacing:1px; text-transform:uppercase; padding:8px 14px;
    cursor:pointer; z-index:10; -webkit-tap-highlight-color:transparent;">
    ◉ Level
  </button>
  <div id="level-wrap">
    <span id="level-label">Tilt</span>
    <div id="level-bar">
      <div id="level-zone"></div>
      <div id="level-marker"></div>
    </div>
    <span id="level-deg">0.0°</span>
  </div>
  <div id="cam-fov-label"></div>
  <div id="rec-btn"><div class="inner"></div></div>
  <div id="rec-indicator"><div class="rec-dot"></div><span id="rec-dur">00:00</span></div>
</div>

<script>
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let fov = 66;
let animId;
const video      = document.getElementById('video');
const canvas     = document.getElementById('overlay-canvas');
const ctx        = canvas.getContext('2d');
const compCanvas = document.getElementById('comp-canvas');
const compCtx    = compCanvas.getContext('2d');

// ── Screen 1 ──────────────────────────────────────────────
document.getElementById('btn-go-cal').addEventListener('click', () => {
  computeCal(); show('screen-cal');
});
document.getElementById('btn-start').addEventListener('click', () => {
  fov = parseFloat(document.getElementById('fov-val').value) || 66;
  startCamera();
});

// ── Screen 2: calibration ─────────────────────────────────
const calRuler  = document.getElementById('cal-ruler');
const calDist   = document.getElementById('cal-dist');
const calResult = document.getElementById('cal-result');
const calResVal = document.getElementById('cal-result-val');
const calFml    = document.getElementById('cal-formula');
const btnUseCal = document.getElementById('btn-use-cal');
let computedVfov = null;

function computeCal() {
  const h = parseFloat(calRuler.value);
  const d = parseFloat(calDist.value);
  if (!h || !d || d <= 0 || h <= 0) {
    calResult.classList.remove('visible'); btnUseCal.style.display = 'none'; return;
  }
  computedVfov = 2 * Math.atan((h / 2) / d) * (180 / Math.PI);
  calResVal.textContent = computedVfov.toFixed(1);
  calFml.textContent = '2 × atan(' + (h/2).toFixed(1) + ' / ' + d + ') = ' + computedVfov.toFixed(2) + '°';
  calResult.classList.add('visible');
  btnUseCal.style.display = 'block';
}
calRuler.addEventListener('input', computeCal);
calDist.addEventListener('input',  computeCal);

document.getElementById('btn-use-cal').addEventListener('click', () => {
  if (!computedVfov) return;
  fov = Math.round(computedVfov * 10) / 10;
  document.getElementById('fov-val').value = fov;
  show('screen-home');
});
document.getElementById('btn-cal-back').addEventListener('click', () => show('screen-home'));

// ── Screen 3: camera ──────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    show('screen-cam');
    document.getElementById('cam-fov-label').textContent = 'VFOV ' + fov + '°';
    resize(); cancelAnimationFrame(animId); draw();
  } catch(e) {
    alert('Camera blocked. Serve over HTTPS (GitHub Pages).');
  }
}

document.getElementById('cam-back').addEventListener('click', () => {
  if (isRecording) stopRecording();
  cancelAnimationFrame(animId);
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  show('screen-home');
});

// ── Recording ─────────────────────────────────────────────
let mediaRecorder = null, recordedChunks = [], isRecording = false;
let recStartTime = null, recTimerInterval = null;

const recBtn       = document.getElementById('rec-btn');
const recIndicator = document.getElementById('rec-indicator');
const recDur       = document.getElementById('rec-dur');

recBtn.addEventListener('click', () => { if (!isRecording) startRecording(); else stopRecording(); });

function startRecording() {
  recordedChunks = [];
  const stream = compCanvas.captureStream(30);

  // Safari outputs MP4/H.264 natively — check mp4 first
  const mimeTypes = [
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
    ''
  ];
  const mimeType = mimeTypes.find(m => m === '' || MediaRecorder.isTypeSupported(m));

  try {
    mediaRecorder = new MediaRecorder(stream, {
      ...(mimeType ? { mimeType } : {}),
      videoBitsPerSecond: 1_500_000   // 1.5 Mbps → ~11 MB/min
    });
  } catch(e) {
    mediaRecorder = new MediaRecorder(stream);
  }

  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const type = mediaRecorder.mimeType || 'video/mp4';
    const ext  = type.includes('webm') ? 'webm' : 'mp4';
    const blob = new Blob(recordedChunks, { type });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'fov-' + Date.now() + '.' + ext; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };

  mediaRecorder.start(100);
  isRecording = true;
  recBtn.classList.add('recording');
  recIndicator.style.display = 'flex';
  recStartTime = Date.now();
  recTimerInterval = setInterval(updateRecTimer, 500);
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecording = false;
  recBtn.classList.remove('recording');
  recIndicator.style.display = 'none';
  clearInterval(recTimerInterval);
  recDur.textContent = '00:00';
}

function updateRecTimer() {
  const s = Math.floor((Date.now() - recStartTime) / 1000);
  recDur.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

// ── Stabilizer + Level indicator ─────────────────────────
let stabEnabled  = false;
let levelEnabled = false;
let rawBeta      = 90;   // raw sensor beta
let smoothBeta   = 90;   // EMA-smoothed beta
let pitchOffset  = 0;    // degrees from upright (smoothed)
let sensorActive = false;
const EMA_ALPHA  = 0.15; // smoothing factor — lower = smoother but slower

const stabBtn        = document.getElementById('stab-btn');
const stabTilt       = document.getElementById('stab-tilt');
const levelToggleBtn = document.getElementById('level-toggle-btn');
const levelWrap      = document.getElementById('level-wrap');
const levelMarker    = document.getElementById('level-marker');
const levelDeg       = document.getElementById('level-deg');

const LEVEL_RANGE = 5; // ± degrees shown in the bar

function onOrientation(e) {
  if (e.beta === null) return;
  rawBeta = e.beta;
  // EMA smoothing — kills the ±2° jitter at the singularity
  smoothBeta  = EMA_ALPHA * rawBeta + (1 - EMA_ALPHA) * smoothBeta;
  pitchOffset = smoothBeta - 90; // 90° = phone perfectly upright

  if (stabEnabled) stabTilt.textContent = pitchOffset.toFixed(1) + '°';

  if (levelEnabled) {
    // clamp to ±LEVEL_RANGE for display
    const clamped = Math.max(-LEVEL_RANGE, Math.min(LEVEL_RANGE, pitchOffset));
    // map [-LEVEL_RANGE, +LEVEL_RANGE] → [90%, 10%] (top of bar = positive tilt)
    const pct = 50 - (clamped / LEVEL_RANGE) * 40;
    levelMarker.style.top = pct + '%';
    const ok = Math.abs(pitchOffset) <= 1;
    levelMarker.classList.toggle('ok', ok);
    levelDeg.textContent = pitchOffset.toFixed(1) + '°';
    levelDeg.classList.toggle('ok', ok);
  }
}

function startSensor() {
  if (sensorActive) return;
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        if (state === 'granted') {
          window.addEventListener('deviceorientation', onOrientation);
          sensorActive = true;
        } else {
          alert('Motion access denied.\nSettings → Safari → Motion & Orientation Access → On');
          stabEnabled = false; stabBtn.classList.remove('active');
          levelEnabled = false; levelWrap.classList.remove('visible');
        }
      }).catch(() => {
        stabEnabled = false; stabBtn.classList.remove('active');
        levelEnabled = false; levelWrap.classList.remove('visible');
      });
  } else {
    window.addEventListener('deviceorientation', onOrientation);
    sensorActive = true;
  }
}

stabBtn.addEventListener('click', () => {
  stabEnabled = !stabEnabled;
  stabBtn.classList.toggle('active', stabEnabled);
  if (stabEnabled) startSensor();
  else { pitchOffset = 0; stabTilt.textContent = '0.0°'; }
});

levelToggleBtn.addEventListener('click', () => {
  levelEnabled = !levelEnabled;
  levelWrap.classList.toggle('visible', levelEnabled);
  levelToggleBtn.style.borderColor = levelEnabled ? '#0f0' : '#333';
  levelToggleBtn.style.color       = levelEnabled ? '#0f0' : '#aaa';
  if (levelEnabled) startSensor();
});
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth  * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  compCanvas.width  = canvas.offsetWidth;
  compCanvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', () => {
  if (document.getElementById('screen-cam').classList.contains('active')) resize();
});

function draw() {
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);
  drawOverlay(ctx, W, H);
  if (isRecording) {
    compCtx.drawImage(video, 0, 0, compCanvas.width, compCanvas.height);
    drawOverlay(compCtx, compCanvas.width, compCanvas.height);
  }
  animId = requestAnimationFrame(draw);
}

function drawOverlay(c, W, H) {
  const pxPerDeg = H / fov;
  // shift cy by pitch offset so 0° stays gravity-aligned when stabilizer is on
  const cy = H / 2 + (stabEnabled ? pitchOffset * pxPerDeg : 0);
  const halfFov = fov / 2;
  const axisX = W * 0.5;
  c.save();

  // dashed axis
  c.strokeStyle = 'rgba(0,255,0,0.25)'; c.lineWidth = 1; c.setLineDash([4,8]);
  c.beginPath(); c.moveTo(axisX,0); c.lineTo(axisX,H); c.stroke();
  c.setLineDash([]);

  // ticks
  for (let d = -Math.ceil(halfFov); d <= Math.ceil(halfFov); d++) {
    const y = cy - d * pxPerDeg;
    if (y < -2 || y > H + 2) continue;
    const isMajor = d % 10 === 0, isMid = d % 5 === 0;
    let tw, sw, alpha;
    if (isMajor)    { tw=36; sw=1.5; alpha=0.95; }
    else if (isMid) { tw=22; sw=1.0; alpha=0.6;  }
    else            { tw=12; sw=0.7; alpha=0.35; }
    c.strokeStyle = `rgba(0,255,0,${alpha})`; c.lineWidth = sw;
    c.beginPath(); c.moveTo(axisX-tw/2,y); c.lineTo(axisX+tw/2,y); c.stroke();
    if (isMajor) {
      const lbl = d + '°';
      c.font = '700 12px "Courier New",monospace';
      c.textAlign = 'left'; c.textBaseline = 'middle';
      const lw = c.measureText(lbl).width;
      c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(axisX+22,y-9,lw+8,18);
      c.fillStyle = '#00ff00'; c.globalAlpha = 0.9;
      c.fillText(lbl, axisX+25, y); c.globalAlpha = 1;
    }
  }

  // crosshair
  c.strokeStyle = 'rgba(0,255,0,0.7)'; c.lineWidth = 1.2;
  c.beginPath();
  c.moveTo(axisX-20,cy); c.lineTo(axisX-6,cy);
  c.moveTo(axisX+6, cy); c.lineTo(axisX+20,cy);
  c.moveTo(axisX,cy-20); c.lineTo(axisX,cy-6);
  c.moveTo(axisX,cy+6);  c.lineTo(axisX,cy+20);
  c.stroke();
  c.strokeStyle='#00ff00'; c.lineWidth=1.5;
  c.strokeRect(axisX-5,cy-5,10,10);

  // edge lines
  [-1,1].forEach(s => {
    const ey = cy - s * halfFov * pxPerDeg;
    if (ey < 0 || ey > H) return;
    c.strokeStyle='rgba(0,255,0,0.5)'; c.lineWidth=1;
    c.beginPath(); c.moveTo(0,ey); c.lineTo(W,ey); c.stroke();
    const lbl = (s>0?'+':'') + (s*halfFov).toFixed(1)+'°';
    c.font='700 10px "Courier New",monospace';
    c.textAlign='center'; c.textBaseline = s>0?'bottom':'top';
    const lw = c.measureText(lbl).width;
    c.fillStyle='rgba(0,0,0,0.5)';
    c.fillRect(axisX-lw/2-4, s>0?ey-17:ey+1, lw+8, 15);
    c.fillStyle='#00cc00';
    c.fillText(lbl, axisX, s>0?ey-3:ey+3);
  });

  c.restore();
}
</script>
</body>
