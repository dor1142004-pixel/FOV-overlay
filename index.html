<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FOV Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; font-family: 'Courier New', monospace; overflow: hidden; }

  /* ── shared screen base ── */
  .screen {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 40px 28px;
    background: #000; overflow-y: auto;
  }
  .screen.active { display: flex; }

  .logo { font-size: 10px; letter-spacing: 4px; color: #444; text-transform: uppercase; }
  .screen-title { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px; text-align: center; }
  .screen-sub { font-size: 12px; color: #555; text-align: center; line-height: 1.7; font-family: system-ui, sans-serif; max-width: 260px; }

  /* ── number input ── */
  .big-input-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 280px; }
  .big-input-label { font-size: 10px; letter-spacing: 3px; color: #444; text-transform: uppercase; }
  .big-input-row { display: flex; align-items: center; gap: 10px; background: #111; border: 1px solid #222; border-radius: 10px; padding: 10px 16px; width: 100%; }
  .big-input-row input[type=number] {
    background: transparent; border: none; outline: none;
    color: #0f0; font-family: 'Courier New', monospace;
    font-size: 36px; font-weight: 700; flex: 1; width: 0;
    -moz-appearance: textfield;
  }
  .big-input-row input::-webkit-inner-spin-button,
  .big-input-row input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .big-unit { font-size: 13px; color: #444; }

  /* two-column inputs */
  .input-row-2 { display: flex; gap: 12px; width: 100%; max-width: 280px; }
  .input-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .input-col label { font-size: 10px; letter-spacing: 2px; color: #444; text-transform: uppercase; }
  .input-col .big-input-row { padding: 8px 12px; }
  .input-col .big-input-row input { font-size: 26px; }

  /* ── result box ── */
  .result-box {
    width: 100%; max-width: 280px;
    background: #0a1a0a; border: 1px solid #1a3a1a; border-radius: 10px;
    padding: 14px 16px; text-align: center; display: none;
  }
  .result-box.visible { display: block; }
  .result-label { font-size: 10px; letter-spacing: 3px; color: #4a7a4a; text-transform: uppercase; margin-bottom: 6px; }
  .result-val { font-size: 42px; font-weight: 700; color: #0f0; letter-spacing: -2px; line-height: 1; }
  .result-unit { font-size: 16px; color: #0a0; }
  .result-formula { font-size: 10px; color: #2a4a2a; margin-top: 6px; font-family: system-ui, sans-serif; }

  /* ── buttons ── */
  .btn-green {
    background: #0f0; color: #000; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    padding: 15px; cursor: pointer; font-family: 'Courier New', monospace;
    width: 100%; max-width: 280px; -webkit-tap-highlight-color: transparent;
  }
  .btn-green:active { opacity: 0.7; }

  .btn-outline {
    background: transparent; color: #555; border: 1px solid #2a2a2a; border-radius: 8px;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    padding: 13px; cursor: pointer; font-family: 'Courier New', monospace;
    width: 100%; max-width: 280px; -webkit-tap-highlight-color: transparent;
  }
  .btn-outline:active { border-color: #0f0; color: #0f0; }

  .divider {
    font-size: 10px; color: #2a2a2a; letter-spacing: 2px;
    display: flex; align-items: center; gap: 10px; width: 100%; max-width: 280px;
  }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:#1a1a1a; }

  /* ── camera screen ── */
  #screen-cam { padding: 0; background: #000; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #cam-back {
    position: absolute; top: calc(env(safe-area-inset-top,0px) + 14px); left: 16px;
    background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 8px;
    color: #aaa; font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: 1px; text-transform: uppercase; padding: 8px 14px;
    cursor: pointer; z-index: 10; -webkit-tap-highlight-color: transparent;
  }
  #cam-fov-label {
    position: absolute; bottom: calc(env(safe-area-inset-bottom,0px) + 24px);
    left: 50%; transform: translateX(-50%);
    color: #0f0; font-size: 12px; letter-spacing: 2px; z-index: 10;
    background: rgba(0,0,0,0.55); padding: 6px 16px; border-radius: 6px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- Screen 1: Home -->
<div class="screen active" id="screen-home">
  <div class="logo">Fieldview</div>
  <div class="screen-title">FOV Overlay</div>

  <div class="big-input-wrap">
    <span class="big-input-label">Vertical FOV</span>
    <div class="big-input-row">
      <input type="number" id="fov-val" min="1" max="180" value="66" />
      <span class="big-unit">°</span>
    </div>
  </div>

  <button class="btn-green" id="btn-start">Start Camera</button>

  <div class="divider">or</div>

  <button class="btn-outline" id="btn-cal">Calibrate VFOV →</button>
</div>

<!-- Screen 2: Calibration -->
<div class="screen" id="screen-cal">
  <div class="logo">Fieldview</div>
  <div class="screen-title">Calibrate</div>
  <p class="screen-sub">
    Stand at a known distance from a ruler.<br>
    Frame so the ruler fills the full height of the screen — bottom of ruler at bottom of frame, top at top.
  </p>
  <p class="screen-sub" style="color:#2a4a2a;font-size:11px;">
    VFOV = atan( ruler height / distance )
  </p>

  <div class="input-row-2">
    <div class="input-col">
      <label>Ruler height</label>
      <div class="big-input-row">
        <input type="number" id="cal-ruler" min="1" max="9999" value="100" />
        <span class="big-unit">cm</span>
      </div>
    </div>
    <div class="input-col">
      <label>Distance</label>
      <div class="big-input-row">
        <input type="number" id="cal-dist" min="1" max="99999" value="100" />
        <span class="big-unit">cm</span>
      </div>
    </div>
  </div>

  <div class="result-box" id="cal-result">
    <div class="result-label">Computed VFOV</div>
    <div><span class="result-val" id="cal-result-val">—</span><span class="result-unit"> °</span></div>
    <div class="result-formula" id="cal-formula"></div>
  </div>

  <button class="btn-green" id="btn-use-cal" style="display:none;">Use this VFOV</button>
  <button class="btn-outline" id="btn-cal-back">← Back</button>
</div>

<!-- Screen 3: Camera -->
<div class="screen" id="screen-cam">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay-canvas"></canvas>
  <button id="cam-back">← Back</button>
  <div id="cam-fov-label"></div>
</div>

<script>
// ── screen navigation ──────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let fov = 66;
let animId;
const video  = document.getElementById('video');
const canvas = document.getElementById('overlay-canvas');
const ctx    = canvas.getContext('2d');

// ── screen 1 ──────────────────────────────────────────────
document.getElementById('btn-cal').addEventListener('click', () => {
  computeCal();
  show('screen-cal');
});

document.getElementById('btn-start').addEventListener('click', () => {
  fov = parseFloat(document.getElementById('fov-val').value) || 66;
  startCamera();
});

// ── screen 2: calibration ─────────────────────────────────
const calRuler   = document.getElementById('cal-ruler');
const calDist    = document.getElementById('cal-dist');
const calResult  = document.getElementById('cal-result');
const calResVal  = document.getElementById('cal-result-val');
const calFormula = document.getElementById('cal-formula');
const btnUseCal  = document.getElementById('btn-use-cal');

let computedVfov = null;

function computeCal() {
  const h = parseFloat(calRuler.value);
  const d = parseFloat(calDist.value);
  if (!h || !d || d <= 0 || h <= 0) {
    calResult.classList.remove('visible');
    btnUseCal.style.display = 'none';
    return;
  }
  computedVfov = Math.atan(h / d) * (180 / Math.PI);
  calResVal.textContent = computedVfov.toFixed(1);
  calFormula.textContent = 'atan(' + h + ' / ' + d + ') = ' + computedVfov.toFixed(2) + '°';
  calResult.classList.add('visible');
  btnUseCal.style.display = 'block';
}

calRuler.addEventListener('input', computeCal);
calDist.addEventListener('input',  computeCal);

document.getElementById('btn-use-cal').addEventListener('click', () => {
  if (!computedVfov) return;
  fov = Math.round(computedVfov * 10) / 10;
  document.getElementById('fov-val').value = fov;
  show('screen-home');
});

document.getElementById('btn-cal-back').addEventListener('click', () => show('screen-home'));

// ── screen 3: camera ──────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    show('screen-cam');
    document.getElementById('cam-fov-label').textContent = 'VFOV ' + fov + '°';
    resize();
    cancelAnimationFrame(animId);
    draw();
  } catch(e) {
    alert('Camera blocked. Serve over HTTPS (GitHub Pages).');
  }
}

document.getElementById('cam-back').addEventListener('click', () => {
  cancelAnimationFrame(animId);
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  show('screen-home');
});

// ── canvas ────────────────────────────────────────────────
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth  * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { if (document.getElementById('screen-cam').classList.contains('active')) resize(); });

function draw() {
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);

  const cy      = H / 2;
  const halfFov = fov / 2;
  const pxPerDeg = H / fov;
  const axisX   = W * 0.5;

  ctx.save();

  // dashed axis
  ctx.strokeStyle = 'rgba(0,255,0,0.25)'; ctx.lineWidth = 1; ctx.setLineDash([4,8]);
  ctx.beginPath(); ctx.moveTo(axisX, 0); ctx.lineTo(axisX, H); ctx.stroke();
  ctx.setLineDash([]);

  // ticks
  for (let d = -Math.ceil(halfFov); d <= Math.ceil(halfFov); d++) {
    const y = cy - d * pxPerDeg;
    if (y < -2 || y > H + 2) continue;
    const isMajor = d % 10 === 0, isMid = d % 5 === 0;
    let tw, sw, alpha;
    if (isMajor)    { tw=36; sw=1.5; alpha=0.95; }
    else if (isMid) { tw=22; sw=1.0; alpha=0.6;  }
    else            { tw=12; sw=0.7; alpha=0.35; }
    ctx.strokeStyle = `rgba(0,255,0,${alpha})`; ctx.lineWidth = sw;
    ctx.beginPath(); ctx.moveTo(axisX-tw/2, y); ctx.lineTo(axisX+tw/2, y); ctx.stroke();
    if (isMajor) {
      const lbl = d + '°';
      ctx.font = '700 12px "Courier New",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const lw = ctx.measureText(lbl).width;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(axisX+22, y-9, lw+8, 18);
      ctx.fillStyle = '#00ff00'; ctx.globalAlpha = 0.9;
      ctx.fillText(lbl, axisX+25, y); ctx.globalAlpha = 1;
    }
  }

  // crosshair
  ctx.strokeStyle = 'rgba(0,255,0,0.7)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(axisX-20,cy); ctx.lineTo(axisX-6,cy);
  ctx.moveTo(axisX+6, cy); ctx.lineTo(axisX+20,cy);
  ctx.moveTo(axisX,cy-20); ctx.lineTo(axisX,cy-6);
  ctx.moveTo(axisX,cy+6);  ctx.lineTo(axisX,cy+20);
  ctx.stroke();
  ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 1.5;
  ctx.strokeRect(axisX-5, cy-5, 10, 10);

  // top / bottom edge lines
  [-1, 1].forEach(s => {
    const ey = cy - s * halfFov * pxPerDeg;
    if (ey < 0 || ey > H) return;
    ctx.strokeStyle = 'rgba(0,255,0,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, ey); ctx.lineTo(W, ey); ctx.stroke();
    const lbl = (s > 0 ? '+' : '') + (s * halfFov).toFixed(1) + '°';
    ctx.font = '700 10px "Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = s > 0 ? 'bottom' : 'top';
    const lw = ctx.measureText(lbl).width;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(axisX - lw/2 - 4, s > 0 ? ey-17 : ey+1, lw+8, 15);
    ctx.fillStyle = '#00cc00';
    ctx.fillText(lbl, axisX, s > 0 ? ey-3 : ey+3);
  });

  ctx.restore();
  animId = requestAnimationFrame(draw);
}
</script>
</body>
</html>
